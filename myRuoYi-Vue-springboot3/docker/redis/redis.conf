bind 0.0.0.0
protected-mode no
port 6379
dir /data

# 持久化: RDB + AOF
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfsync everysec

# 内存上限(小内存机器), 超限后 LRU 淘汰
maxmemory 256mb
maxmemory-policy allkeys-lru

loglevel notice
logfile ""
databases 16
timeout 0
tcp-keepalive 300

# docker-compose: 密码经 --requirepass 注入(有密码时 protected-mode 自动放行)
# Railway: 私有网络内免密直连, 故 protected-mode no
